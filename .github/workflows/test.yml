# Tests + conformance on every push/PR: the full rune + keep suites, which
# include the artifact-format golden vectors (hash canonicalization) and the
# composition parity suite — drift against the shared contracts fails here the
# day it lands.
name: test
on:
  push:
    branches: [develop, main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # generated modules (lsp-config.ts, version.gen.ts) are gitignored —
      # a fresh checkout must run setup before the graph type-checks
      - run: deno task setup
      - run: deno test -A src/rune/ keep/ e2e/
